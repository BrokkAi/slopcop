name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Snapshot build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean
      - name: Upload snapshot artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: slopcop-snapshot
          path: dist/*
          if-no-files-found: error
      # The wheels are packed here, where GoReleaser left the binaries, and
      # the jobs below check them on every platform that can run them before
      # anything reaches PyPI. See docs/src/content/docs/contribute/pypi-publishing.md.
      - name: Pack the PyPI wheels
        if: startsWith(github.ref, 'refs/tags/')
        run: make wheels PYPI_FLAGS='--dist dist' PYPI_VERSION="$GITHUB_REF_NAME"
      - name: Upload the PyPI wheels
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: pypi-dist/*.whl
          if-no-files-found: error

  npm:
    name: npm package
    needs: goreleaser
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or newer; the packaging tests are
      # written against this CLI.
      - name: Install the npm CLI
        run: npm install --global npm@11.19.0
      - name: Test the launcher and the packer
        run: make npm-test
      - name: Download the release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets \
            --pattern 'slopcop_*' --pattern 'checksums.txt'
      - name: Pack the tarball from the release archives
        run: make npm-pack
      - name: Smoke-test the packed tarball
        run: make npm-smoke
      # npm authenticates with the OIDC token GitHub issues to this workflow
      # and nothing else, so there is no npm token anywhere in this repository.
      - name: Publish with trusted publishing
        run: make npm-publish

  pypi-install:
    name: pypi install (${{ matrix.runner }})
    needs: goreleaser
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: pypi-dist
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      # Nothing is published until the wheel for every platform GitHub can run
      # has been installed there and the command it puts on PATH has answered.
      - name: Install the wheel for this platform and run it
        run: |
          case "$RUNNER_OS" in
            Windows) PY=python; VENV=venv/Scripts; EXE=.exe ;;
            *) PY=python3; VENV=venv/bin; EXE= ;;
          esac
          "$PY" -m venv venv
          "$VENV/python" -m pip install --quiet --no-index --find-links pypi-dist brokk-slopcop
          "$VENV/slopcop$EXE" version
          "$VENV/python" -m brokk_slopcop version

  pypi:
    name: pypi package
    needs: [goreleaser, pypi-install]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/brokk-slopcop
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: pypi-dist
      # PyPI exchanges the OIDC token GitHub issues to this job for short-lived
      # credentials and signs the uploads, so no PyPI token exists anywhere in
      # this repository.
      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist
          # A rerun of a half-finished upload publishes whatever is missing.
          skip-existing: true

  # docs.slopcop.com deploys from `production`, so a stable CLI release moves
  # `production` forward to the tagged commit and the docs ship with the CLI
  # they describe. See docs/src/content/docs/contribute/docs.md.
  docs-production:
    name: Promote docs to production
    needs: goreleaser
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write # fast-forward the production branch
      actions: write # dispatch the Docs workflow on production
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fast-forward production to the tagged commit
        run: |
          tagged="$(git rev-parse "$GITHUB_SHA^{commit}")"
          if ! git fetch --quiet origin refs/heads/production:refs/remotes/origin/production; then
            echo "::error::The production branch does not exist. Create it from master before releasing."
            exit 1
          fi
          production="$(git rev-parse origin/production)"
          if git merge-base --is-ancestor "$tagged" "$production"; then
            echo "production ($production) already contains $RELEASE_TAG ($tagged); nothing to move."
          elif git merge-base --is-ancestor "$production" "$tagged"; then
            # A plain push: the server refuses anything but a fast-forward.
            git push origin "$tagged:refs/heads/production"
            echo "Fast-forwarded production from $production to $RELEASE_TAG ($tagged)."
          else
            echo "::error::production ($production) is not an ancestor of $RELEASE_TAG ($tagged), so it cannot be fast-forwarded. production must only ever move forward along master; reconcile it by hand."
            exit 1
          fi
      # The push above used GITHUB_TOKEN, which starts no workflow on its own.
      - name: Deploy the docs from production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref production
