name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Snapshot build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean
      - name: Upload snapshot artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: slopcop-snapshot
          path: dist/*
          if-no-files-found: error
      # GoReleaser has no PyPI publisher, so the binaries it just built become
      # the PyPI wheels here, and the jobs below check and publish them.
      - name: Build the PyPI wheels
        if: startsWith(github.ref, 'refs/tags/')
        run: make wheels PYPI_FLAGS='--dist dist' PYPI_VERSION="$GITHUB_REF_NAME"
      - name: Upload the PyPI wheels
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: pypi-dist/*.whl
          if-no-files-found: error

  # Nothing is published to PyPI until the wheel for a platform has been
  # installed on that platform and the command it puts on PATH has run.
  install:
    name: install (${{ matrix.runner }})
    needs: goreleaser
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: pypi-dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install the wheel for this platform and run it
        run: |
          case "$RUNNER_OS" in
            Windows) PY=python; VENV=venv/Scripts; EXE=.exe ;;
            *) PY=python3; VENV=venv/bin; EXE= ;;
          esac
          "$PY" -m venv venv
          "$VENV/python" -m pip install --quiet --no-index --find-links pypi-dist brokk-slopcop
          "$VENV/slopcop$EXE" version
          "$VENV/python" -m brokk_slopcop version

  pypi:
    name: publish to PyPI
    needs: [goreleaser, install]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/brokk-slopcop
    # Trusted publishing: the upload is authorized by this job's OIDC token,
    # so no PyPI API token is stored anywhere.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: pypi-dist
      - name: Publish the wheels
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist
          # A re-run after a half-finished upload finishes the release.
          skip-existing: true
