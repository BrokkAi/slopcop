name: Docs

# Builds the Starlight site under docs/ and deploys it to GitHub Pages, which
# serves it at docs.slopcop.com (the custom domain is set in the repository's
# Pages settings; an Actions deployment needs no CNAME file).
#
# The site documents both the CLI and the hosted service, so it deploys from
# the `docs-production` branch, never from master. `docs-production` stays an ancestor
# of master and is fast-forwarded by the two releases the site describes: a
# stable CLI tag here (release.yml) and bifrost-service's promotion to
# production. A push to master or a pull request that touches docs/ builds
# without deploying, so a broken page fails before it ships.
#
# A push made with the built-in GITHUB_TOKEN starts no workflow, so release.yml
# runs this workflow on `docs-production` with workflow_dispatch after moving it.
# The Actions tab can do the same to redeploy by hand; a dispatch on any other
# branch only builds.
on:
  push:
    branches: [master, docs-production]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci
        working-directory: docs

      - name: Render social card
        run: npm run social-card
        working-directory: docs

      - name: Build docs
        run: npm run build
        working-directory: docs
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          PUBLIC_DOCS_SITE: ${{ vars.DOCS_SITE || 'https://docs.slopcop.com' }}
          PUBLIC_DOCS_BASE: ${{ vars.DOCS_BASE || '/' }}

      - name: Prove links hold below a path prefix
        if: github.event_name == 'pull_request'
        run: npm run build
        working-directory: docs
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          PUBLIC_DOCS_SITE: https://brokkai.github.io
          PUBLIC_DOCS_BASE: /slopcop

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/docs-production'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist

  deploy:
    name: Deploy docs
    if: github.ref == 'refs/heads/docs-production'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
