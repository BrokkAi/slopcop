name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The release ships linux, darwin, and windows on amd64 and arm64, so all
    # three get a real test run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
      # bash keeps one recipe working on all three runners, where `make` and a
      # POSIX shell are not a given.
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "gofmt needed:"
            echo "$files"
            exit 1
          fi
      - name: Vet
        shell: bash
        run: go vet ./...
      - name: Test
        shell: bash
        run: go test ./...

  release:
    name: release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
      - name: Check the release config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
      - name: Snapshot-build every release target
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --snapshot --clean

  npm:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: make npm-test
      # Packs and installs a stand-in release, so a packaging target that
      # cannot run fails here instead of after a tag published a release.
      - name: Pack and smoke-test the packaging
        run: |
          node npm/scripts/fixture-release.mjs --tag v0.0.0-fixture --assets release-assets
          make npm-pack NPM_TAG=v0.0.0-fixture
          make npm-smoke NPM_TAG=v0.0.0-fixture

  pypi:
    name: PyPI wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
      # The wheels are packed from the same GoReleaser build the release uses,
      # so a target whose wheel cannot be packed, resolved, or installed fails
      # here instead of after a tag published a release.
      - name: Snapshot-build every release target
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --snapshot --clean
      - name: Pack the wheels
        run: make wheels PYPI_FLAGS='--dist dist'
      - name: Check every wheel resolves on the platform it names
        run: |
          for wheel in pypi-dist/*.whl; do
            tag="${wheel##*-py3-none-}"
            tag="${tag%.whl}"
            echo "checking $tag"
            resolvable=$(python3 -m pip install --dry-run --no-index --find-links pypi-dist \
              --only-binary=:all: --target "$RUNNER_TEMP/dry" --platform "$tag" \
              --python-version 3.12 --implementation py brokk-slopcop)
            case "$resolvable" in
              *"-py3-none-$tag.whl"*) ;;
              *) echo "pip found no wheel for $tag:"; echo "$resolvable"; exit 1 ;;
            esac
          done
      - name: Install the wheel for this runner and run it
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --no-index --find-links pypi-dist brokk-slopcop
          "$RUNNER_TEMP/venv/bin/slopcop" version
          "$RUNNER_TEMP/venv/bin/python" -m brokk_slopcop version

  # The one check the master ruleset requires, so auto-merge waits for all of
  # CI. Add new jobs to `needs` and to the list below instead of to the ruleset.
  required:
    name: Required
    if: ${{ always() }}
    needs:
      - check
      - release
      - npm
      - pypi
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify every job succeeded
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          NPM_RESULT: ${{ needs.npm.result }}
          PYPI_RESULT: ${{ needs.pypi.result }}
        run: |
          failures=0
          check() {
            printf '| %s | %s |\n' "$1" "$2" >> "$GITHUB_STEP_SUMMARY"
            if [ "$2" = success ]; then return; fi
            echo "$1 finished as $2" >&2
            failures=1
          }
          {
            echo "## Required"
            echo
            echo '| Job | Result |'
            echo '| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"
          check 'check' "$CHECK_RESULT"
          check 'release config' "$RELEASE_RESULT"
          check 'npm package' "$NPM_RESULT"
          check 'PyPI wheels' "$PYPI_RESULT"
          exit "$failures"
