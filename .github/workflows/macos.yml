name: macOS CI

# The release ships darwin on amd64 and arm64, but macOS runners are scarcer
# and cost ten times Linux minutes, so ci.yml tests on Linux and Windows on
# each change and this runs the same checks on macOS every four hours. Like
# bifrost-dev's hourly.yml, a scheduled run is skipped when the newest
# finished run passed at the same commit. A failure opens an issue (or comments
# on the open one) naming the commit range, and the next green run closes it.
# Dispatch it by hand to test a branch on macOS before it merges.

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Master queues behind the running run; on any other branch a newer dispatch
# supersedes the older one.
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  gate:
    name: gate (new commits since last run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      last: ${{ steps.check.outputs.last }}
    steps:
      # Skips only when the newest finished run passed at this commit, so a
      # failure, scheduled or dispatched, is tried again on the next schedule.
      # Newest is by when a run last finished, so a rerun attempt counts.
      - name: Skip scheduled runs when the newest finished run passed at this commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow macos.yml \
            --status completed --branch "$GITHUB_REF_NAME" --limit 20 \
            --json headSha,conclusion,updatedAt \
            --jq 'sort_by(.updatedAt) | reverse')"
          last="$(jq -r 'map(select(.conclusion == "success")) | .[0].headSha // ""' <<<"$runs")"
          newest="$(jq -r 'map(select(.conclusion == "success" or .conclusion == "failure")) | .[0] | "\(.headSha // "") \(.conclusion // "")"' <<<"$runs")"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch; running regardless of new commits."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Newest finished run: ${newest:-<none>}; current: $GITHUB_SHA"
          if [ "$newest" = "$GITHUB_SHA success" ]; then
            echo "The newest finished run passed at this commit; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: check (macos-latest)
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  # Master runs only, scheduled or dispatched: a dispatched run on master that
  # passes is what the next scheduled run skips on, so it closes the issue too.
  # A dispatched branch run says its result in the run itself.
  report:
    name: report
    needs: [gate, check]
    if: ${{ always() && github.ref == 'refs/heads/master' && needs.gate.outputs.changed == 'true' && (needs.check.result == 'success' || needs.check.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.check.result }}
          LAST: ${{ needs.gate.outputs.last }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="macOS CI is failing on master"
          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // \"\"")"
          if [ "$RESULT" = success ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --repo "$GITHUB_REPOSITORY" \
                --comment "macOS CI passes again at $GITHUB_SHA: $RUN_URL"
            fi
            exit 0
          fi
          range="$GITHUB_SHA"
          if [ -n "$LAST" ]; then
            range="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$LAST...$GITHUB_SHA"
          fi
          body="$(printf 'macOS CI failed at %s: %s\n\nCommits since the last green macOS run: %s\n' "$GITHUB_SHA" "$RUN_URL" "$range")"
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
